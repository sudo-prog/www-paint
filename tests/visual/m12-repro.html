<!DOCTYPE html><html><body><script type="module">
import { PaintingEngine } from '/js/engine/engine.js';
function mulberry32(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t=(t+Math.imul(t^(t>>>7),t^61))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const size=256;
const c=document.createElement('canvas');c.width=size;c.height=size;const ctx=c.getContext('2d');
const R=mulberry32(0xC0FFEE);
const g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#2b3a55');g.addColorStop(.5,'#7d9d9c');g.addColorStop(1,'#e8ded1');ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
const pal=['#d94f4f','#e0a63c','#4f8ed9','#5bbf7a','#8a5bd9'];
for(let i=0;i<pal.length;i++){const cx=size*(0.18+0.16*i),cy=size*(0.30+0.10*Math.sin(i*1.7)),r=size*(0.07+0.02*i);ctx.beginPath();ctx.fillStyle=pal[i];ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#1c1c24';ctx.fillRect(size*0.10,size*0.70,size*0.32,size*0.18);
ctx.fillStyle='#f4f1ea';ctx.beginPath();ctx.moveTo(size*0.72,size*0.22);ctx.lineTo(size*0.92,size*0.58);ctx.lineTo(size*0.52,size*0.58);ctx.closePath();ctx.fill();
const n=size/8;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=Math.floor(R()*60);ctx.fillStyle=`rgba(${v},${v},${v},0.06)`;ctx.fillRect(x*8,y*8,8,8);}
window.run = async (style) => {
  const cv=document.createElement('canvas');cv.width=size;cv.height=size;
  const e=new PaintingEngine({canvas:cv,width:size,height:size,useWorker:false,background:'#ffffff'});
  await e.loadImage(c);
  await e.generate({style,count:700,seed:3047602159,multiLayer:false});
  // capture the first few shapes
  const shapes = e.layers[0].strokes.slice(0,5).map(s=>({t:s.type,plen:s.params.length,p:s.params,seed:s.seed,style:s.style}));
  return {count:e.getTotalStrokes(), shapes};
};
window.harnessReady=true;
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WWW_PAINT — visual regression harness</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:12px/1.4 monospace}#out{padding:8px}</style>
</head>
<body>
<div id="out">loading engine…</div>
<script type="module">
/**
 * Visual regression harness (Phase 0.2).
 *
 * Exposes window.runCase({style, seed, count, size}) which:
 *   1. builds a DETERMINISTIC procedural test image,
 *   2. runs the real PaintingEngine (no worker) with a fixed seed,
 *   3. exports the PNG and returns a SHA-256 of the bytes + a data URL.
 *
 * Driven by scripts/visual-regression.cjs. Nothing here is app code — the
 * harness imports the same engine the app uses so the baseline measures the
 * shipped path.
 */
import { PaintingEngine } from '/js/engine/engine.js';
import { getAllStyles } from '/js/styles/index.js';

const out = document.getElementById('out');

// ── Deterministic PRNG (mulberry32) — must NOT use Math.random ─────────────
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Deterministic test image: 256x256 composition ──────────────────────────
const IMG_SIZE = 256;
function buildTestImage(size = IMG_SIZE) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const R = mulberry32(0xC0FFEE);

  // diagonal gradient background
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#2b3a55');
  g.addColorStop(0.5, '#7d9d9c');
  g.addColorStop(1, '#e8ded1');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  // fixed palette blobs
  const palette = ['#d94f4f', '#e0a63c', '#4f8ed9', '#5bbf7a', '#8a5bd9'];
  for (let i = 0; i < palette.length; i++) {
    const cx = size * (0.18 + 0.16 * i);
    const cy = size * (0.30 + 0.10 * Math.sin(i * 1.7));
    const r = size * (0.07 + 0.02 * i);
    ctx.beginPath();
    ctx.fillStyle = palette[i];
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // dark rectangle (shadows region)
  ctx.fillStyle = '#1c1c24';
  ctx.fillRect(size * 0.10, size * 0.70, size * 0.32, size * 0.18);

  // bright triangle (highlights region)
  ctx.fillStyle = '#f4f1ea';
  ctx.beginPath();
  ctx.moveTo(size * 0.72, size * 0.22);
  ctx.lineTo(size * 0.92, size * 0.58);
  ctx.lineTo(size * 0.52, size * 0.58);
  ctx.closePath();
  ctx.fill();

  // structured texture: fixed-grid value noise (deterministic)
  const n = size / 8;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const v = Math.floor(R() * 60);
      ctx.fillStyle = `rgba(${v},${v},${v},0.06)`;
      ctx.fillRect(x * 8, y * 8, 8, 8);
    }
  }
  return c;
}

// ── SHA-256 of an ArrayBuffer ──────────────────────────────────────────────
async function sha256Hex(buf) {
  const d = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── Diagnostics: record the last createRadialGradient arguments ────────────
// (Chrome throws an opaque IndexSizeError when r1 < 0; recording the args makes
// a failing case self-describing without editing the style under test.)
window.__lastGrad = null;
const _origCRG = CanvasRenderingContext2D.prototype.createRadialGradient;
CanvasRenderingContext2D.prototype.createRadialGradient = function (...args) {
  window.__lastGrad = args.slice();
  return _origCRG.apply(this, args);
};

// ── Run one case ───────────────────────────────────────────────────────────
window.runCase = async function runCase({ style, seed = 0x1337BEEF, count = 600, size = IMG_SIZE }) {
  try {
    return await _runCase({ style, seed, count, size });
  } catch (e) {
    const g = window.__lastGrad;
    return {
      ok: false, style, error: (e && e.stack) || String(e), lastGrad: g,
      badWidthCount: window.__diag ? window.__diag.length : null,
      badWidthSample: window.__diag ? window.__diag.slice(0, 3) : null,
    };
  }
};

async function _runCase({ style, seed = 0x1337BEEF, count = 600, size = IMG_SIZE }) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const engine = new PaintingEngine({ canvas, width: size, height: size, useWorker: false, background: '#ffffff' });

  const src = buildTestImage(size);
  await engine.loadImage(src);
  await engine.generate({ style, count, seed, multiLayer: false });

  // INVARIANT: every emitted S-stroke must have a positive width (params[6]).
  // A non-positive width is invalid geometry and has previously crashed the
  // render path (createRadialGradient with r1 < 0). Check it here so a
  // regression is caught by name, not by an opaque canvas error.
  window.__diag = [];
  for (const L of engine.layers) {
    for (const s of (L.strokes || [])) {
      if (s.type === 'S' && !(s.params[6] > 0)) {
        window.__diag.push({ id: s.id, w: s.params[6], p: s.params.slice(0, 9), style: s.style });
      }
    }
  }
  if (window.__diag.length) {
    throw new Error(`invariant: ${window.__diag.length} S-stroke(s) with width <= 0 (e.g. ${JSON.stringify(window.__diag[0])})`);
  }

  engine.render();

  const blob = await engine.exportPNG({ width: size, height: size });
  const buf = await blob.arrayBuffer();
  const hash = await sha256Hex(buf);
  const dataURL = canvas.toDataURL('image/png');

  const strokes = engine.getTotalStrokes();
  engine.destroy();
  return { ok: true, style, seed, count, size, strokes, bytes: buf.byteLength, hash, dataURL };
};

// ── Registry count (STYLE_INVENTORY maintenance check) ─────────────────────
window.styleCount = () => getAllStyles().length;
window.harnessReady = true;
out.textContent = `engine loaded — styles: ${getAllStyles().length}`;
</script>
</body>
</html>

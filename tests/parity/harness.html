<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WWW_PAINT — parity harness (R0)</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:12px/1.4 monospace}#out{padding:8px}</style>
</head>
<body>
<div id="out">loading…</div>
<!-- Reference shape-drawing library (test fixture only, never shipped) -->
<script src="/scripts/codepainter-shp.js"></script>
<script type="module">
/**
 * Parity harness (Clean-room Track R0).
 *
 * Runs three engines on identical deterministic images at the same seed/stroke
 * count and reports, per image:
 *   - `sim`  : the objective each engine reports (reference + our Painter).
 *   - `mae`  : mean abs error of the RENDERED canvas vs the source, computed
 *              here (independent of any engine self-report) → `simMae`.
 *
 * Engines:
 *   - reference : external reference worker (scripts/codepainter-worker.js) — fixture
 *   - port      : js/engine/painter.js — the app's painter
 *   - modular   : js/engine/optimizer.js (Track R1) — the engine of record
 *
 * window.runAll() → { images:[{name, results:{reference,port,modular}}] }
 */
import { Painter } from '/js/engine/painter.js';
import { analyzeImage } from '/js/engine/analyzer.js';
import { optimise } from '/js/engine/optimizer.js';

const out = document.getElementById('out');
const SIZE = 256, SEED = 12345, SHAPES = 400, STYLE = 'painterly';

// ── deterministic PRNG ─────────────────────────────────────────────────────
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── deterministic test images ──────────────────────────────────────────────
function imgBlobs(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#2b3a55'); g.addColorStop(0.5, '#7d9d9c'); g.addColorStop(1, '#e8ded1');
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const pal = ['#d94f4f', '#e0a63c', '#4f8ed9', '#5bbf7a', '#8a5bd9'];
  for (let i = 0; i < pal.length; i++) {
    ctx.beginPath(); ctx.fillStyle = pal[i];
    ctx.arc(size * (0.18 + 0.16 * i), size * (0.30 + 0.10 * Math.sin(i * 1.7)), size * (0.07 + 0.02 * i), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#1c1c24'; ctx.fillRect(size * 0.10, size * 0.70, size * 0.32, size * 0.18);
  ctx.fillStyle = '#f4f1ea'; ctx.beginPath();
  ctx.moveTo(size * 0.72, size * 0.22); ctx.lineTo(size * 0.92, size * 0.58); ctx.lineTo(size * 0.52, size * 0.58); ctx.closePath(); ctx.fill();
  const R = mulberry32(0xC0FFEE), n = size / 8;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = Math.floor(R() * 60); ctx.fillStyle = `rgba(${v},${v},${v},0.06)`; ctx.fillRect(x * 8, y * 8, 8, 8);
  }
  return c;
}

function imgRings(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;
  for (let r = size * 0.5; r > 4; r -= 10) {
    const t = r / (size * 0.5);
    ctx.beginPath();
    ctx.fillStyle = `hsl(${210 + 140 * t}, ${35 + 45 * t}%, ${20 + 55 * (1 - t)}%)`;
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  return c;
}

function imgSmooth(size) { // photo-like: soft overlapping colour fields
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const R = mulberry32(0x5EED);
  for (let i = 0; i < 7; i++) {
    const g = ctx.createRadialGradient(size * R(), size * R(), 1, size * R(), size * R(), size * 0.6);
    g.addColorStop(0, `hsla(${(R() * 360) | 0}, ${(40 + R() * 40) | 0}%, ${(35 + R() * 40) | 0}%, 0.9)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  }
  return c;
}

function imgNoise(size) { // high-detail stress case
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const R = mulberry32(0xBEEF);
  const im = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const o = i * 4, v = R() * 255;
    im.data[o] = v; im.data[o + 1] = (v * 1.7) & 255; im.data[o + 2] = (v * 0.4) & 255; im.data[o + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
  return c;
}

const IMAGES = [
  { name: 'blobs',  build: imgBlobs },
  { name: 'rings',  build: imgRings },
  { name: 'smooth', build: imgSmooth },
  { name: 'noise',  build: imgNoise },
];

// ── drawing helpers ────────────────────────────────────────────────────────
// Our modular shape format: { type, params, color0, color1, alpha }
function drawModular(ctx, s) {
  const t = s.type, p = s.params, c0 = s.color0, c1 = s.color1, a = s.alpha ?? 1;
  const rgba = (c, al) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${al})`;
  const grad = () => {
    const mx = (p[0] + (p[4] ?? p[2] ?? p[0])) / 2, my = (p[1] + (p[5] ?? p[3] ?? p[1])) / 2;
    const g = ctx.createLinearGradient(mx - 8, my - 8, mx + 8, my + 8);
    g.addColorStop(0, rgba(c0, 1)); g.addColorStop(1, rgba(c1, 1)); return g;
  };
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = grad(); ctx.strokeStyle = grad();
  switch (t) {
    case 'E': ctx.beginPath(); ctx.ellipse(p[0], p[1], Math.max(0.1, p[2]), Math.max(0.1, p[3]), p[4] || 0, 0, Math.PI * 2); ctx.fill(); break;
    case 'B': { const r = Math.max(0.1, Math.max(p[2] || 1, p[3] || 1)); const g2 = ctx.createRadialGradient(p[0], p[1], r * 0.1, p[0], p[1], r);
      g2.addColorStop(0, rgba(c0, 1)); g2.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(p[0], p[1], Math.max(0.1, p[2]), Math.max(0.1, p[3]), p[4] || 0, 0, Math.PI * 2); ctx.fill(); break; }
    case 'T': ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.lineTo(p[4], p[5]); ctx.closePath(); ctx.fill(); break;
    case 'R': ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(p[4] || 0); ctx.fillRect(-p[2] / 2, -p[3] / 2, p[2], p[3]); ctx.restore(); break;
    case 'S': ctx.lineWidth = Math.max(0.5, p[6] || 1); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo(p[2], p[3], p[4], p[5]); ctx.stroke(); break;
  }
  ctx.restore();
}

// Reference worker shape format: { t, p, c0, c1, a } → draw with SHP.lib
function drawReference(ctx, s) {
  try { SHP.lib(ctx)[s.t](...SHP.args(s, 1)); } catch (e) { /* skip bad shape */ }
}

// ── metrics: independent (not self-reported) vs source ─────────────────────
// Block SSIM (8x8, standard constants) on luminance — an independent perceptual
// score, deliberately different from either engine's own objective.
function ssimLuma(a, b, w, h) {
  const lum = (px) => { const L = new Float32Array(w * h); for (let i = 0; i < w * h; i++) { const o = i * 4; L[i] = 0.2126 * px[o] + 0.7152 * px[o + 1] + 0.0722 * px[o + 2]; } return L; };
  const A = lum(a), B = lum(b);
  const C1 = 6.5025, C2 = 58.5225; // (0.01*255)^2, (0.03*255)^2
  let sum = 0, blocks = 0;
  for (let by = 0; by + 8 <= h; by += 8) {
    for (let bx = 0; bx + 8 <= w; bx += 8) {
      let sa = 0, sb = 0;
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const i = (by + y) * w + bx + x; sa += A[i]; sb += B[i]; }
      const n = 64, ma = sa / n, mb = sb / n;
      let va = 0, vb = 0, cov = 0;
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const i = (by + y) * w + bx + x; const da = A[i] - ma, db = B[i] - mb; va += da * da; vb += db * db; cov += da * db; }
      va /= n; vb /= n; cov /= n;
      sum += ((2 * ma * mb + C1) * (2 * cov + C2)) / ((ma * ma + mb * mb + C1) * (va + vb + C2));
      blocks++;
    }
  }
  return blocks ? +(sum / blocks).toFixed(4) : 0;
}

function metricsVsSource(ctx, size, srcPx) {
  const d = ctx.getImageData(0, 0, size, size).data;
  const n = size * size;
  let s = 0;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    s += Math.abs(d[o] - srcPx[o]) + Math.abs(d[o + 1] - srcPx[o + 1]) + Math.abs(d[o + 2] - srcPx[o + 2]);
  }
  const mae = s / (3 * n);
  return { mae: +mae.toFixed(2), simMae: +(100 * (1 - mae / 255)).toFixed(2), ssim: ssimLuma(d, srcPx, size, size) };
}

function avgColor(srcPx) {
  let r = 0, g = 0, b = 0; const n = srcPx.length / 4;
  for (let i = 0; i < srcPx.length; i += 4) { r += srcPx[i]; g += srcPx[i + 1]; b += srcPx[i + 2]; }
  return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
}

// ── engine runners ─────────────────────────────────────────────────────────
async function runPort(srcPx, size, bg) {
  return new Promise((resolve) => {
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size);
    let done = false;
    const fin = (sim) => { if (done) return; done = true; resolve({ sim, ...metricsVsSource(ctx, size, srcPx), canvas: c }); };
    const painter = new Painter({
      width: size, height: size, imageData: new Uint8ClampedArray(srcPx),
      options: { style: STYLE, smart: false, maxShapes: SHAPES, seed: SEED,
        onShape: (s) => drawModular(ctx, { type: s.t, params: s.p, color0: s.c0, color1: s.c1, alpha: s.a }),
        onDone: (r) => fin(r.sim) },
    });
    painter.start();
    setTimeout(() => fin(null), 30000);
  });
}

async function runModular(srcPx, size, bg) {
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size);
  const analysis = analyzeImage(new Uint8ClampedArray(srcPx), size, size);
  // Track R1 optimiser core: residual/error-driven placement + local hill-climb.
  const { shapes } = optimise(analysis, { count: SHAPES, seed: SEED });
  for (const s of shapes) drawModular(ctx, s);
  return { sim: null, strokes: shapes.length, ...metricsVsSource(ctx, size, srcPx), canvas: c };
}

async function runReference(srcPx, size, bg) {
  return new Promise((resolve, reject) => {
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size);
    let done = false;
    const fin = (sim) => { if (done) return; done = true; resolve({ sim, ...metricsVsSource(ctx, size, srcPx), canvas: c }); };
    const blob = new Blob([window.CP_WORKER_SRC], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    worker.addEventListener('message', (e) => {
      const m = e.data;
      if (m.type === 'shape') drawReference(ctx, m.s);
      else if (m.type === 'done') { URL.revokeObjectURL(url); worker.terminate(); fin(m.sim); }
    });
    worker.onerror = (err) => { URL.revokeObjectURL(url); worker.terminate(); reject(err); };
    worker.postMessage({ type: 'start', gen: 1, w: size, h: size, data: srcPx, current: null, count0: 0,
      shapes: SHAPES, styles: [STYLE], bgStyles: [], smart: false, abstract: false, lines: false,
      outline: 'off', rfill: 'off', stylesize: {}, seed: SEED, size: 1, sizeRand: false, palette: null,
      under: false, order: null, line: null, band: null, fresh: null, video: false });
    setTimeout(() => fin(null), 60000);
  });
}

// ── main ───────────────────────────────────────────────────────────────────
window.runAll = async function runAll() {
  window.CP_WORKER_SRC = await fetch('/scripts/codepainter-worker.js').then((r) => r.text());
  const results = [];
  for (const def of IMAGES) {
    const img = def.build(SIZE);
    const ictx = img.getContext('2d');
    const srcPx = new Uint8ClampedArray(ictx.getImageData(0, 0, SIZE, SIZE).data);
    const bg = avgColor(srcPx);
    out.textContent = `running ${def.name}…`;
    const reference = await runReference(srcPx, SIZE, bg).catch((e) => ({ error: String(e) }));
    const port = await runPort(srcPx, SIZE, bg);
    const modular = await runModular(srcPx, SIZE, bg);
    results.push({
      name: def.name,
      results: {
        reference: { sim: reference.sim, simMae: reference.simMae, mae: reference.mae, ssim: reference.ssim },
        port: { sim: port.sim, simMae: port.simMae, mae: port.mae, ssim: port.ssim },
        modular: { sim: modular.sim, simMae: modular.simMae, mae: modular.mae, ssim: modular.ssim, strokes: modular.strokes },
      },
      _canvases: { source: img, reference: reference.canvas, port: port.canvas, modular: modular.canvas },
    });
  }
  // Build one composite strip for eyeballing: source | reference | port | modular (first image).
  const r0 = results[0]._canvases;
  const gap = 12, labelH = 22, W = SIZE, cols = 4;
  const comp = document.createElement('canvas');
  comp.width = W * cols + gap * (cols + 1);
  comp.height = SIZE + labelH + gap * 2;
  const cc = comp.getContext('2d');
  cc.fillStyle = '#111'; cc.fillRect(0, 0, comp.width, comp.height);
  cc.fillStyle = '#74c0fc'; cc.font = '12px monospace';
  const labels = ['source', 'reference (CP)', 'port (ours)', 'modular (clean-room)'];
  const cans = [r0.source, r0.reference, r0.port, r0.modular];
  cans.forEach((cv, i) => {
    const x = gap + i * (W + gap);
    cc.fillText(labels[i], x, 15);
    if (cv) cc.drawImage(cv, x, labelH);
  });
  window.__composite = comp.toDataURL('image/png');

  const clean = results.map((r) => ({ name: r.name, results: r.results }));
  out.textContent = 'done';
  return clean;
};

window.harnessReady = true;
out.textContent = 'ready';
</script>
</body>
</html>

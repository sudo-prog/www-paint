<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>WWW_PAINT — Visual Style Engine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0b0d'/%3E%3C/svg%3E" />

  </head>
  <body>
    <div id="app">
      <div class="base" aria-hidden="true"></div>

      <div class="body">
        <!-- Left rail: brush controls (default) -->
        <aside class="panel panel-left panel--controls" id="controls-root" role="complementary" aria-label="Brush controls">
          <div class="panel-strip">
            <span class="logo"><span class="logo__text">WWW</span><span class="logo__slash">_</span><span class="logo__text">PAINT</span></span>
            <span class="strip-sep" aria-hidden="true"></span>
            <button class="strip-name" id="btn-project" title="Rename project">Untitled</button>
            <span class="strip-chip" id="strip-dims">1024 × 768</span>
            <button id="toggle-theme" class="strip-chip strip-chip--btn" title="Toggle theme" aria-label="Toggle theme">
              <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
            </button>
          </div>
          <div class="panel-head">
            <span class="panel-title">Brush</span>
            <button class="collapse-btn" data-rail="controls-root" aria-expanded="true" aria-controls="controls-root" title="Collapse panel">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
              <span class="sr-only">Collapse Brush panel</span>
            </button>
          </div>
          <div class="rail-icons">
            <button class="rail-icon-btn is-active nav-btn" data-nav="controls" aria-label="Brush" title="Brush controls"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 14 9 5 9-5"/></svg><span class="btn-label">Brush</span></button>
            <button class="rail-icon-btn nav-btn" data-nav="layers" aria-label="Layers" title="Layers"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16"/></svg><span class="btn-label">Layers</span></button>
          </div>
          <!-- controls.js builds .controls-scroll here -->
          <footer class="panel-footer status-footer" id="status-bar" role="status" aria-live="polite">
            <span class="status__msg" id="status-message">Ready</span>
          </footer>
        </aside>

        <!-- Paint toolbar (left-rail surface) -->
        <aside class="panel paint-toolbar panel--hidden" id="paint-toolbar" role="complementary" aria-label="Paint toolbar">
          <div class="panel-strip">
            <span class="logo"><span class="logo__text">WWW</span><span class="logo__slash">_</span><span class="logo__text">PAINT</span></span>
            <span class="strip-sep" aria-hidden="true"></span>
            <span class="strip-name">Paint</span>
            <span class="strip-chip" id="strip-dims-paint">1024 × 768</span>
          </div>
          <div class="panel-head"><span class="panel-title">Paint</span>
            <button class="collapse-btn" data-rail="paint-toolbar" aria-expanded="true" aria-controls="paint-toolbar" title="Collapse panel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button></div>
          <div class="rail-icons"></div>
          <div class="paint-toolbar__body">
            <select class="paint-toolbar__select" id="paint-preset"></select>
            <input type="color" class="paint-toolbar__color" id="paint-color" value="#222222">
            <input type="range" class="paint-toolbar__slider" id="paint-weight" min="1" max="20" step="0.5" value="4">
            <span class="paint-toolbar__value" id="paint-weight-value">4</span>
            <button type="button" class="btn btn--ghost btn--sm" id="paint-clear" aria-label="Clear layer">Clear</button>
          </div>
        </aside>

        <!-- Media panel (left-rail surface) -->
        <aside class="panel panel--media" id="media-root" role="complementary" aria-label="Media, wet and tonal controls">
          <div class="panel-strip">
            <span class="logo"><span class="logo__text">WWW</span><span class="logo__slash">_</span><span class="logo__text">PAINT</span></span>
            <span class="strip-sep" aria-hidden="true"></span>
            <span class="strip-name">Media</span>
            <span class="strip-chip" id="strip-dims-media">1024 × 768</span>
          </div>
          <div class="panel-head"><span class="panel-title">Media</span>
            <button class="collapse-btn" data-rail="media-root" aria-expanded="true" aria-controls="media-root" title="Collapse panel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button></div>
          <div class="rail-icons"></div>
        </aside>

        <!-- Style library (left-rail surface) -->
        <aside class="panel panel--library" id="style-library-root" role="complementary" aria-label="Style library">
          <div class="panel-strip">
            <span class="logo"><span class="logo__text">WWW</span><span class="logo__slash">_</span><span class="logo__text">PAINT</span></span>
            <span class="strip-sep" aria-hidden="true"></span>
            <span class="strip-name">Library</span>
            <span class="strip-chip" id="strip-dims-lib">1024 × 768</span>
          </div>
          <div class="panel-head"><span class="panel-title">Library</span>
            <button class="collapse-btn" data-rail="style-library-root" aria-expanded="true" aria-controls="style-library-root" title="Collapse panel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button></div>
          <div class="rail-icons"></div>
        </aside>

        <!-- Right rail: layers -->
        <aside class="panel panel-right panel--layers" id="layers-root" role="complementary" aria-label="Layers">
          <div class="panel-strip panel-strip--right">
            <button class="strip-chip strip-chip--btn" id="btn-export-panel" aria-label="Export and share" title="Export &amp; share" aria-expanded="false" aria-controls="export-panel-root">
              <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 10l5 5l5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </button>
            <span class="strip-chip is-static" aria-hidden="true">PNG</span>
          </div>
          <div class="panel-head">
            <span class="panel-title">Layers</span>
            <button class="collapse-btn" data-rail="layers-root" aria-expanded="true" aria-controls="layers-root" title="Collapse panel">

              <span class="sr-only">Collapse Layers panel</span>
            </button>
          </div>
          <div class="rail-icons"></div>
          <!-- layers.js builds .layers-header + .layers-body here -->
        </aside>

        <!-- Canvas window -->
        <main class="canvas-card canvas-wrapper" id="canvas-area" role="main">
          <div class="canvas-head">
            <span>Canvas · <span id="canvas-dims">1024 × 768</span></span>
            <span class="canvas-head-spacer" aria-hidden="true"></span>
            <span id="canvas-mode">Generate</span>
          </div>
          <div class="canvas-body">
            <div class="canvas-frame frame" id="canvas-frame">
              <canvas id="paint-canvas" width="1024" height="768" class="paint-canvas" aria-label="Painting canvas"></canvas>
              <div class="canvas-placeholder" id="canvas-placeholder" role="status" aria-live="polite">
                <div class="canvas-placeholder__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></div>
                <div class="canvas-placeholder__title">Drop an image to begin</div>
                <div class="canvas-placeholder__hint">Or click Open above</div>
                <div class="file-input-picker">
                  <input type="file" id="image-file-input" accept="image/*" aria-label="Select image file"/>
                </div>
              </div>
            </div>
            <div class="motion-controls-root insert-host" id="motion-controls" role="region" aria-label="Playback controls"></div>
            <!-- glass pill toolbar action row — LAYERS .insert-btn pattern:
                 icon + compact label, 30px tall, pill radius. The old 44px
                 round-btn circles wrapped their text labels to 3 lines and
                 clipped (Generate clip 9px, Painter clip 3px at 390). -->
            <div class="insert-bar" id="insert-bar" role="toolbar" aria-label="Actions">
              <button type="button" class="insert-btn" id="btn-load-image" aria-label="Open image" title="Open image"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span class="insert-btn-label">Open</span></button>
              <button type="button" class="insert-btn insert-btn--primary" id="btn-gener" aria-label="Generate painting" title="Generate painting"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8 10H4v4h4l2 4 2-4h4l-2-4h-4z"/></svg><span class="insert-btn-label">Generate</span></button>
              <button type="button" class="insert-btn" id="btn-export" aria-label="Export" title="Export"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span class="insert-btn-label">Export</span></button>
              <button type="button" class="insert-btn" id="btn-ui-settings" aria-label="UI Settings" title="UI Settings"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m10 0h6"/></svg><span class="insert-btn-label">Settings</span></button>
              <button type="button" class="insert-btn" id="btn-modular-engine" aria-label="Engine: legacy painter" title="Engine — toggle the modular engine (Track R6)" aria-pressed="false"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="4"/></svg><span class="insert-btn-label">Painter</span></button>
              <button type="button" class="insert-btn" id="btn-react-surface" aria-label="Style profiles (React)" title="Style profiles — React/ui-sdk" aria-expanded="false" aria-controls="react-root"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="insert-btn-label">React</span></button>
            </div>
          </div>
        </main>
      </div>

      <div class="radius-bar" role="group" aria-label="View controls">
        <button class="nav-btn radius-mode-btn" id="btn-media-mode" aria-label="Media" title="Media controls"><svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 4.2 6 7.2 6 10a6 6 0 1 1-12 0c0-2.8 2.5-5.8 6-10Z"/></svg><span class="btn-label">Media</span></button>
        <button class="nav-btn radius-mode-btn" id="btn-library-mode" aria-label="Library" title="Style library"><svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg><span class="btn-label">Library</span></button>
        <button class="nav-btn radius-mode-btn" id="btn-paint-mode" aria-label="Paint" title="Paint mode"><svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L13 16l-4 1 1-4Z"/></svg><span class="btn-label">Paint</span></button>
        <button class="nav-btn radius-mode-btn" id="btn-brush-maker" aria-label="Brush Maker" title="Brush Maker — create custom brushes" aria-expanded="false" aria-controls="brush-maker-root"><svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="btn-label">Brush</span></button>
        <span class="radius-bar-title">Radius</span>
        <div class="radius-group">
          <button class="radius-btn" data-radius="16" aria-pressed="false">16</button>
          <button class="radius-btn" data-radius="28" aria-pressed="true">28</button>
          <button class="radius-btn" data-radius="44" aria-pressed="false">44</button>
        </div>
        <span class="radius-bar-title" style="margin-left:8px">Panels</span>
        <button class="nav-btn" data-nav="expanded" aria-pressed="true">Expanded</button>
        <button class="nav-btn" data-nav="collapsed" aria-pressed="false">Navbar</button>
      </div>

      <!-- mobile toggles -->
      <button class="mobile-toggle" id="toggle-controls" aria-label="Toggle controls" aria-expanded="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="mobile-toggle" id="toggle-layers" aria-label="Toggle layers" aria-expanded="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16"/></svg>
      </button>

      <div id="react-root" class="react-surface-root" data-closed="true">
        <div id="profile-root"></div>
      </div>
      <div class="modal" id="export-root" aria-hidden="true" aria-labelledby="export-title" role="dialog" aria-modal="true"></div>
      <div class="export-panel" id="export-panel-root" aria-hidden="true" aria-labelledby="export-panel-title" role="dialog" aria-modal="true"></div>
      <div id="debug-root"></div>
      <div id="brush-maker-root" style="display:none"></div>
      <div id="settings-root">
        <div id="settings-overlay" class="settings-overlay" role="dialog" aria-labelledby="settings-title" aria-modal="true"></div>
      </div>
    </div>

    <script type="module">
      import './js/ui/debug.js?v=20261124b';
      import './js/ui/settings.js?v=20261124b';
      import { initApp } from './js/ui/app.js?v=20261124b';
      import { attachMediaPanel } from './js/ui/media-host.js?v=20261124b';
      import { attachStyleLibrary } from './js/ui/style-library-host.js?v=20261124b';
      import { attachExportPanel } from './js/ui/export-host.js?v=20261124b';
      import { initA11yHardening } from './js/ui/a11y-hardening.js?v=20261124b';
      import { attachReactSurface } from './js/ui/react-host.js?v=20261124b';
      import { attachModularSwitch } from './js/ui/modular-switch-host.js?v=20261124b';
      import { initAuditFix } from './js/ui/audit-fix-host.js?v=20261124b';
      import { initShell } from './js/ui/shell-host.js?v=20261124b';

      const app = initApp();
      attachMediaPanel(app);
      attachStyleLibrary(app);
      attachExportPanel(app);
      initA11yHardening();
      attachReactSurface(app);
      attachModularSwitch(app);
      window._wwwPaint = app;
      initAuditFix(app);
      initShell(app);

      // Mobile toggles
      const controlsPanel = document.querySelector('.panel--controls');
      const layersPanel = document.querySelector('.panel--layers');
      const toggleControls = document.getElementById('toggle-controls');
      const toggleLayers = document.getElementById('toggle-layers');
      const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
      if (isMobile()) {
        controlsPanel?.classList.add('panel--mobile-closed');
        layersPanel?.classList.add('panel--mobile-closed');
      }
      toggleControls?.addEventListener('click', () => {
        if (!controlsPanel) return;
        const closed = controlsPanel.classList.contains('panel--mobile-closed') || controlsPanel.classList.contains('is-collapsed');
        app._setPanelCollapsed(controlsPanel, !closed);
      });
      toggleLayers?.addEventListener('click', () => {
        if (!layersPanel) return;
        const closed = layersPanel.classList.contains('panel--mobile-closed') || layersPanel.classList.contains('is-collapsed');
        app._setPanelCollapsed(layersPanel, !closed);
      });

      // Mode toggles — media/library swap the left rail.
      document.getElementById('btn-media-mode')?.addEventListener('click', () => {
        if (typeof app.toggleMediaMode === 'function') app.toggleMediaMode();
      });
      document.getElementById('btn-library-mode')?.addEventListener('click', () => {
        if (typeof app.toggleLibraryMode === 'function') app.toggleLibraryMode();
      });

      // nav wiring (LAYERS data-nav contract) — panels carry panel--<target>
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-nav');
          if (!target) return;
          // Expanded/Navbar are handled by shell-host; skip panel toggling for them
          if (target === 'expanded' || target === 'collapsed') return;
          document.querySelectorAll('.panel').forEach(p => p.classList.remove('panel--active'));
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-btn--active'));
          const panel = document.querySelector('.panel--' + target);
          if (panel) panel.classList.add('panel--active');
          btn.classList.add('nav-btn--active');
        });
      });
    </script>

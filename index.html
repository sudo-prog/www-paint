<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WWW_PAINT — Brush. Generate. Create.</title>

  <!-- Fonts: Space Grotesk (body/UI) + Space Mono (data/labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
  <div class="app">
    <!-- ── Top Bar ── -->
    <header class="top-bar" role="banner">
      <div class="top-bar__left">
        <div class="logo" aria-label="WWW_PAINT">
          <span class="logo__dot"></span>
          <span class="logo__text">WWW</span>
          <span class="logo__slash">_</span>
          <span class="logo__text">PAINT</span>
        </div>
      </div>

      <nav class="top-bar__center" aria-label="Main navigation">
        <button type="button" class="nav-btn nav-btn--active" data-nav="controls">
          <span class="nav-btn__icon">⚙</span>Brush
        </button>
        <button type="button" class="nav-btn" data-nav="layers">
          <span class="nav-btn__icon">┅</span>Layers
        </button>
        <button type="button" class="nav-btn" id="btn-paint-mode" title="Toggle paint mode">
          <span class="nav-btn__icon">✏</span>Paint
        </button>
      </nav>

      <div class="top-bar__right">
        <button type="button" class="mobile-toggle" id="toggle-controls" aria-label="Toggle controls">⚙</button>
        <button type="button" class="mobile-toggle" id="toggle-layers" aria-label="Toggle layers">┅</button>
        <button type="button" class="btn btn--ghost btn--sm" id="btn-load-image" aria-label="Open image">
          <span class="btn__icon">▲</span>Open
        </button>
        <button type="button" class="round-btn round-btn--primary" id="btn-gener" aria-label="Generate painting" title="Generate painting">
          <span class="round-btn__icon">▶</span>
        </button>
        <button type="button" class="round-btn round-btn--ghost" id="btn-export" aria-label="Export" title="Export">
          <span class="round-btn__icon">⬇</span>
        </button>
        <button type="button" class="round-btn round-btn--ghost" id="btn-ui-settings" aria-label="UI Settings" title="UI Settings">
          <span class="round-btn__icon">◐</span>
        </button>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="main">
      <!-- Controls Panel -->
      <aside class="panel panel--controls" id="controls-root" role="complementary" aria-label="Brush controls">
        <!-- Built by controls.js -->
      </aside>

      <!-- Canvas Area -->
      <section class="canvas-wrapper" id="canvas-area" role="main">
        <div class="canvas-frame">
          <canvas id="paint-canvas" width="1024" height="768" class="paint-canvas" aria-label="Painting canvas"></canvas>
          <div class="canvas-placeholder" id="canvas-placeholder" role="status" aria-live="polite">
            <div class="canvas-placeholder__icon">◉</div>
            <div class="canvas-placeholder__title">Drop an image to begin</div>
            <div class="canvas-placeholder__hint">Or click Open above</div>
            <input type="file" class="file-input-picker" accept="image/*" style="display: none;" aria-label="Select image file"/>
          </div>
        </div>
      </section>

      <!-- Paint Toolbar (freehand painting controls) -->
      <aside class="paint-toolbar" id="paint-toolbar" role="complementary" aria-label="Paint toolbar">
        <div class="paint-toolbar__row">
          <label class="paint-toolbar__label">Brush</label>
          <select class="paint-toolbar__select" id="paint-preset">
            <option value="HB">HB</option>
            <option value="2B">2B</option>
            <option value="charcoal">Charcoal</option>
            <option value="pen">Pen</option>
          </select>
        </div>
        <div class="paint-toolbar__row">
          <label class="paint-toolbar__label">Color</label>
          <input type="color" class="paint-toolbar__color" id="paint-color" value="#222222">
        </div>
        <div class="paint-toolbar__row">
          <label class="paint-toolbar__label">Weight</label>
          <input type="range" class="paint-toolbar__slider" id="paint-weight" min="1" max="20" step="0.5" value="4">
          <span class="paint-toolbar__value" id="paint-weight-value">4</span>
        </div>
        <div class="paint-toolbar__row paint-toolbar__row--full">
          <button type="button" class="btn btn--ghost btn--sm" id="paint-clear" aria-label="Clear layer">
            Clear Layer
          </button>
        </div>
      </aside>

      <!-- Motion Controls (playback bar for stroke animation) -->
      <div class="motion-controls-root" id="motion-controls" role="region" aria-label="Playback controls">
        <!-- Built by motion.js -->
      </div>

      <!-- Layers Panel -->
      <aside class="panel panel--layers" id="layers-root" role="complementary" aria-label="Layers">
        <!-- Built by layers.js -->
      </aside>
    </main>

    <!-- Status Footer -->
    <footer class="status-footer" id="status-bar" role="status" aria-live="polite">
      <span class="status__msg" id="status-message">Ready</span>
    </footer>
  </div>

  <!-- Export Dialog -->
  <div class="modal" id="export-root" aria-hidden="true" aria-labelledby="export-title" role="dialog" aria-modal="true">
    <!-- Built by export.js -->
  </div>

  <input type="file" id="image-file-input" accept="image/*" style="display: none;" aria-label="Select image file"/>

  <script type="importmap">
  {
    "imports": {
      "./js/ui/app.js": "./js/ui/app.js?v=20261015",
      "./js/ui/debug.js": "./js/ui/debug.js?v=20261015",
      "./js/ui/settings.js": "./js/ui/settings.js?v=20261015",
      "./js/ui/controls.js": "./js/ui/controls.js?v=20261015",
      "./js/engine/engine.js": "./js/engine/engine.js?v=20261015",
      "./js/engine/painter.js": "./js/engine/painter.js?v=20261015",
      "./js/engine/generator.js": "./js/engine/generator.js?v=20261015",
      "./js/engine/analyzer.js": "./js/engine/analyzer.js?v=20261015",
      "./js/engine/shapes.js": "./js/engine/shapes.js?v=20261015",
      "./js/engine/renderer.js": "./js/engine/renderer.js?v=20261015",
      "./js/engine/exporter.js": "./js/engine/exporter.js?v=20261015",
      "./js/styles/index.js": "./js/styles/index.js?v=20261015",
      "./js/ui/canvas.js": "./js/ui/canvas.js?v=20261015",
      "./js/ui/export.js": "./js/ui/export.js?v=20261015",
      "./js/ui/layers.js": "./js/ui/layers.js?v=20261015",
      "./js/ui/motion.js": "./js/ui/motion.js?v=20261015",
      "./js/engine/paint-brush.js": "./js/engine/paint-brush.js?v=20261015",
      "./js/vendor/brush.esm.js": "./js/vendor/brush.esm.js?v=20261015"
    }
  }
  </script>
  <!-- Load debug + settings FIRST so console hooks are live before app init -->
  <script type="module">
    import './js/ui/debug.js?v=20261015';
    import './js/ui/settings.js?v=20261015';
  </script>

  <script type="module">
    import { initApp } from './js/ui/app.js?v=20261015';

    const app = initApp();

    if (app) {
      window._wwwPaint = app;

      // Load image button
      const loadBtn = document.getElementById('btn-load-image');
      const fileInput = document.getElementById('image-file-input');

      loadBtn?.addEventListener('click', () => fileInput?.click());

      fileInput?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = '';
        try {
          await app.engine.loadImageFile(file);
          app.canvasMgr.renderer.setSize(app.engine.width, app.engine.height);
          const placeholder = document.getElementById('canvas-placeholder');
          if (placeholder) placeholder.style.display = 'none';
          app.engine.render();
          app._updateStatus();
        } catch (err) {
          console.error(err);
          app._showError('Failed to load: ' + err.message);
        }
      });

      // Generate button (round, top bar)
      document.getElementById('btn-gener')?.addEventListener('click', () => app.generate());

      // Paint mode weight slider value display
      const weightSlider = document.getElementById('paint-weight');
      const weightValue = document.getElementById('paint-weight-value');
      if (weightSlider && weightValue) {
        weightSlider.addEventListener('input', () => {
          weightValue.textContent = weightSlider.value;
        });
      }

      // Export button (round, top bar)
      document.getElementById('btn-export')?.addEventListener('click', () => {
        app.exportMgr?.show({
          width: app.engine.width,
          height: app.engine.height,
          background: app.engine.background,
        });
      });

      // Navigation between panels
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.nav;
          document.querySelectorAll('.panel').forEach(p => {
            p.classList.toggle('panel--active', p.classList.contains('panel--' + target));
          });
          document.querySelectorAll('.nav-btn').forEach(nav => {
            nav.classList.toggle('nav-btn--active', nav === btn);
          });
        });
      });

      // Mobile toggle buttons — use inline styles to avoid CSS specificity issues
      const controlsPanel = document.querySelector('.panel--controls');
      const layersPanel = document.querySelector('.panel--layers');
      const toggleControls = document.getElementById('toggle-controls');
      const toggleLayers = document.getElementById('toggle-layers');

      function closeMobilePanels() {
        if (controlsPanel) controlsPanel.classList.add('panel--mobile-closed');
        if (layersPanel) layersPanel.classList.add('panel--mobile-closed');
        if (toggleControls) toggleControls.classList.remove('mobile-toggle--active');
        if (toggleLayers) toggleLayers.classList.remove('mobile-toggle--active');
      }

      toggleControls?.addEventListener('click', () => {
        const isClosed = controlsPanel && controlsPanel.classList.contains('panel--mobile-closed');
        closeMobilePanels();
        if (isClosed && controlsPanel) {
          controlsPanel.classList.remove('panel--mobile-closed');
          toggleControls.classList.add('mobile-toggle--active');
        }
      });

      toggleLayers?.addEventListener('click', () => {
        const isClosed = layersPanel && layersPanel.classList.contains('panel--mobile-closed');
        closeMobilePanels();
        if (isClosed && layersPanel) {
          layersPanel.classList.remove('panel--mobile-closed');
          toggleLayers.classList.add('mobile-toggle--active');
        }
      });


    }
  </script>

  <div id="debug-root"></div>
  <div id="settings-root"></div>

</body>
</html>

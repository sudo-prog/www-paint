<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WWW_PAINT — Brush. Generate. Create.</title>

  <!-- Fonts: DM Sans (body/UI) + DM Mono (data/labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
  <div class="app">
    <!-- ── Top Bar ── -->
    <header class="top-bar" role="banner">
      <div class="top-bar__left">
        <div class="logo" aria-label="WWW_PAINT">
          <span class="logo__dot"></span>
          <span class="logo__text">WWW</span>
          <span class="logo__slash">_</span>
          <span class="logo__text">PAINT</span>
        </div>
      </div>

      <nav class="top-bar__center" aria-label="Main navigation">
        <button type="button" class="nav-btn nav-btn--active" data-nav="controls">
          <span class="nav-btn__icon">⚙</span>Brush
        </button>
        <button type="button" class="nav-btn" data-nav="layers">
          <span class="nav-btn__icon">┅</span>Layers
        </button>
      </nav>

      <div class="top-bar__right">
        <button type="button" class="mobile-toggle" id="toggle-controls" aria-label="Toggle controls">⚙</button>
        <button type="button" class="mobile-toggle" id="toggle-layers" aria-label="Toggle layers">┅</button>
        <button type="button" class="btn btn--ghost btn--sm" id="btn-load-image" aria-label="Open image">
          <span class="btn__icon">▲</span>Open
        </button>
        <button type="button" class="btn btn--primary btn--sm" id="btn-export" aria-label="Export">
          Export
        </button>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main class="main">
      <!-- Controls Panel -->
      <aside class="panel panel--controls" id="controls-root" role="complementary" aria-label="Brush controls">
        <!-- Built by controls.js -->
      </aside>

      <!-- Canvas Area -->
      <section class="canvas-wrapper" id="canvas-area" role="main">
        <div class="canvas-frame">
          <canvas id="paint-canvas" width="1024" height="768" class="paint-canvas" aria-label="Painting canvas"></canvas>
          <div class="canvas-placeholder" id="canvas-placeholder" role="status" aria-live="polite">
            <div class="canvas-placeholder__icon">◉</div>
            <div class="canvas-placeholder__title">Drop an image to begin</div>
            <div class="canvas-placeholder__hint">Or click Open above</div>
            <input type="file" class="file-input-picker" accept="image/*" style="display: none;" aria-label="Select image file"/>
          </div>
        </div>
      </section>

      <!-- Layers Panel -->
      <aside class="panel panel--layers" id="layers-root" role="complementary" aria-label="Layers">
        <!-- Built by layers.js -->
      </aside>
    </main>

    <!-- Status Footer -->
    <footer class="status-footer" id="status-bar" role="status" aria-live="polite">
      <span class="status__msg" id="status-message">Ready</span>
    </footer>
  </div>

  <!-- Export Dialog -->
  <div class="modal" id="export-root" aria-hidden="true" aria-labelledby="export-title" role="dialog" aria-modal="true">
    <!-- Built by export.js -->
  </div>

  <!-- Debug / Error Log Panel -->
  <div id="debug-panel" class="debug-panel" hidden>
    <div class="debug-panel__header">
      <span>Debug Log</span>
      <div class="debug-panel__actions">
        <button id="debug-clear" class="btn btn--ghost btn--xs" aria-label="Clear log">Clear</button>
        <button id="debug-toggle" class="btn btn--ghost btn--xs" aria-label="Minimize">_</button>
        <button id="debug-close" class="btn btn--ghost btn--xs" aria-label="Close">×</button>
      </div>
    </div>
    <div id="debug-log" class="debug-panel__body" role="log" aria-live="polite"></div>
  </div>
  <button id="debug-toggle-btn" class="debug-toggle-btn" aria-label="Show debug log">⚡</button>

  <input type="file" id="image-file-input" accept="image/*" style="display: none;" aria-label="Select image file"/>

  <script type="module">
    import { initApp } from './js/ui/app.js';

    const app = initApp();

    if (app) {
      window._wwwPaint = app;

      // Load image button
      const loadBtn = document.getElementById('btn-load-image');
      const fileInput = document.getElementById('image-file-input');

      loadBtn?.addEventListener('click', () => {
        console.log('[DEBUG] Open button clicked');
        fileInput?.click();
      });

      fileInput?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        console.log('[DEBUG] File selected:', file ? file.name + ' (' + file.size + ' bytes)' : 'none');
        if (!file) return;
        e.target.value = '';
        try {
          console.log('[DEBUG] Starting loadImageFile...');
          await app.engine.loadImageFile(file);
          console.log('[DEBUG] Image loaded. Size:', app.engine.width + 'x' + app.engine.height);
          app.canvasMgr.renderer.setSize(app.engine.width, app.engine.height);
          const placeholder = document.getElementById('canvas-placeholder');
          if (placeholder) placeholder.style.display = 'none';
          app.engine.render();
          app._updateStatus();
          console.log('[DEBUG] Render complete');
        } catch (err) {
          console.error('[DEBUG] Load failed:', err);
          app._showError('Failed to load: ' + err.message);
        }
      });

      // Export button
      document.getElementById('btn-export')?.addEventListener('click', () => {
        console.log('[DEBUG] Export button clicked');
        app.exportMgr?.show({
          width: app.engine.width,
          height: app.engine.height,
          background: app.engine.background,
        });
      });

      // Navigation between panels
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.nav;
          document.querySelectorAll('.panel').forEach(p => {
            p.classList.toggle('panel--active', p.classList.contains('panel--' + target));
          });
          document.querySelectorAll('.nav-btn').forEach(nav => {
            nav.classList.toggle('nav-btn--active', nav === btn);
          });
        });
      });

      // Mobile toggle buttons — use inline styles to avoid CSS specificity issues
      const controlsPanel = document.querySelector('.panel--controls');
      const layersPanel = document.querySelector('.panel--layers');
      const toggleControls = document.getElementById('toggle-controls');
      const toggleLayers = document.getElementById('toggle-layers');

      function closeMobilePanels() {
        if (controlsPanel) controlsPanel.style.left = '-320px';
        if (layersPanel) layersPanel.style.right = '-320px';
        if (toggleControls) toggleControls.classList.remove('mobile-toggle--active');
        if (toggleLayers) toggleLayers.classList.remove('mobile-toggle--active');
      }

      toggleControls?.addEventListener('click', () => {
        const isOpen = controlsPanel && controlsPanel.style.left === '0px';
        closeMobilePanels();
        if (!isOpen && controlsPanel) {
          controlsPanel.style.left = '0px';
          toggleControls.classList.add('mobile-toggle--active');
        }
      });

      toggleLayers?.addEventListener('click', () => {
        const isOpen = layersPanel && layersPanel.style.right === '0px';
        closeMobilePanels();
        if (!isOpen && layersPanel) {
          layersPanel.style.right = '0px';
          toggleLayers.classList.add('mobile-toggle--active');
        }
      });

      // ── Debug Panel ──
      (function setupDebugPanel() {
        const panel = document.getElementById('debug-panel');
        const log = document.getElementById('debug-log');
        const toggleBtn = document.getElementById('debug-toggle-btn');
        const clearBtn = document.getElementById('debug-clear');
        const closeBtn = document.getElementById('debug-close');
        const toggleMinBtn = document.getElementById('debug-toggle');

        if (!panel || !log) return;

        const MAX_LINES = 200;
        let lineCount = 0;

        function addLine(level, args) {
          const text = Array.from(args).map(a => {
            if (a instanceof Error) return a.message + '\n' + (a.stack || '');
            if (typeof a === 'object') { try { return JSON.stringify(a); } catch { return String(a); } }
            return String(a);
          }).join(' ');

          const line = document.createElement('div');
          line.className = 'debug-line debug-line--' + level;
          line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
          log.appendChild(line);
          lineCount++;

          while (lineCount > MAX_LINES) {
            log.removeChild(log.firstChild);
            lineCount--;
          }
          log.scrollTop = log.scrollHeight;
        }

        // Hook console
        ['log', 'info', 'warn', 'error'].forEach(level => {
          const orig = console[level];
          console[level] = function(...args) {
            orig.apply(console, args);
            addLine(level, args);
          };
        });

        // Hook uncaught errors
        window.addEventListener('error', e => {
          addLine('error', ['UNCAUGHT: ' + e.message + ' @ ' + e.filename + ':' + e.lineno]);
        });
        window.addEventListener('unhandledrejection', e => {
          addLine('error', ['UNCAUGHT REJECTION: ' + String(e.reason)]);
        });

        // Toggle button
        toggleBtn?.addEventListener('click', () => {
          panel.hidden = !panel.hidden;
          toggleBtn.classList.toggle('debug-toggle-btn--active', !panel.hidden);
        });

        // Minimize
        toggleMinBtn?.addEventListener('click', () => {
          const body = panel.querySelector('.debug-panel__body');
          if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
        });

        // Clear — innerHTML='' is safe here (no user input, just clearing)
        clearBtn?.addEventListener('click', () => { log.innerHTML = ''; lineCount = 0; });

        // Close
        closeBtn?.addEventListener('click', () => { panel.hidden = true; });

        addLine('info', ['Debug panel ready. Console output will appear here.']);
      })();
    }
  </script>
</body>
</html>

# WWW_PAINT — style picker + pill toggle verification
# Requires Chrome 147 (CHROME_BINARY) — Selenium 4.43 in Maestro 2.11.0
# doesn't support CDP v155 (system Chrome 155).
# Run: CHROME_BINARY=.../chrome-for-testing-147 maestro test --headless --screen-size 1440x900 maestro/www-paint-style-picker.yaml
url: http://127.0.0.1:8099/index.maestro.html

---
- launchApp
- extendedWaitUntil:
    visible: "WWW"
    timeout: 30000

# App loaded — verify style trigger shows current style
- assertVisible: "Pencil / Graphite"

# Open the style picker dropdown by tapping the trigger
- tapOn: "Pencil / Graphite"

# Verify all 5 category pills are visible
- assertVisible: "Drawing"
- assertVisible: "Painting"
- assertVisible: "Graphic"
- assertVisible: "Craft"
- assertVisible: "3D / Material"

# Click Graphic category
- tapOn: "Graphic"

# Scroll the DROPDOWN's own grid to Neon. scrollUntilVisible swipes from
# screen centre (the canvas), which closes the dropdown via its outside-click
# handler before the tap lands — measured 2026-11-20: the trigger still read
# "Pencil / Graphite" after the tap. A real layout scroll of the grid keeps
# the dropdown open; the selection contract is asserted on the trigger.
- evalScript: |
    const neon = [...globalThis.document.querySelectorAll('.style-thumb')].find(t => t.dataset.style === 'neon');
    if (neon) neon.scrollIntoView({ block: 'center' });
- tapOn:
    text: "Neon"
    point: "50%,50%"

# Verify the trigger now shows Neon (dropdown closes on selection)
- assertTrue: "globalThis.document.querySelector('.style-picker__trigger-label').textContent === 'Neon'"

# Take screenshot for visual verification
- takeScreenshot: style-picker-final

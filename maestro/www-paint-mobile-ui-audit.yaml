# WWW_PAINT — mobile UI audit
# Tests the mobile layout (triggers max-width: 768px media query).
# Run with: maestro test --headless --screen-size 390x844 www-paint-mobile-ui-audit.yaml
# (--screen-size requires --headless; without it Maestro uses 1200x803 desktop)

url: http://127.0.0.1:8099/index.html

---
- launchApp
# Changed: "WWW" → "Drop an image to begin" (canvas placeholder always visible;
# logo is "WWW_PAINT" inside the left panel strip, hidden when panel closed on mobile).
- extendedWaitUntil:
    visible: "Drop an image to begin"
    timeout: 30000

# ── 1. Top bar (always-visible mobile chrome) ──
# Changed: "Brush"/"Layers" moved to after panel opens (rail-icon labels inside panel).
- assertVisible: "Media"
- assertVisible: "Paint"
- assertVisible: "Open"

# ── 2. Canvas placeholder ──
- assertVisible: "Drop an image to begin"
- assertVisible: "Or click Open above"

# ── Screenshot: canvas initial ──
- takeScreenshot: canvas-with-footer

# ── 3. Mobile toggle buttons should be visible at narrow viewport ──
- assertVisible:
    id: "toggle-controls"

# ── 4. Open controls panel via floating mobile toggle ──
- tapOn:
    id: "toggle-controls"

# ── 5. Controls panel opens ──
# Changed: "Ready"/"pencil"/"Strokes" moved here (status footer lives in left rail,
# visible only when panel is open in the LAYERS shell).
- assertVisible: "Untitled"
- extendedWaitUntil:
    visible: "Ready"
    timeout: 10000
- assertVisible: "pencil"
- assertVisible: "Strokes"
# Changed: "Brush"/"Layers" moved here (rail-icon labels, inside panel).
- assertVisible: "Brush"
- assertVisible: "Layers"

# ── 6. STROKE MIN (sentence case in LAYERS design) ──
# Changed: "STROKE MIN" → "Stroke Min" (controls.js label:"Stroke Min"; old
# uppercase came from CSS text-transform removed by LAYERS design).
- assertVisible: "Stroke Min"

# ── 7. Style picker trigger visible ──
- assertVisible: "Pencil / Graphite"

# ── Screenshot: controls panel expanded ──
- takeScreenshot: controls-panel

# ── 8. Open style picker dropdown ──
- tapOn: "Pencil / Graphite"

# ── 9. Category pills visible ──
- assertVisible: "Drawing"

# ── Screenshot: style picker open ──
- takeScreenshot: style-picker-open

# ── 10. Close dropdown ──
- tapOn: "Pencil / Graphite"

# ── 11. Open settings modal ──
- tapOn:
    id: "btn-ui-settings"

# ── 12. Verify settings modal opened ──
- extendedWaitUntil:
    visible: "UI SETTINGS"
    timeout: 10000
- assertVisible: "Background"
- assertVisible: "Accent"
- assertVisible: "Primary Text"

# ── Screenshot: settings modal ──
- takeScreenshot: settings-modal-open

# ── 13. Close settings ──
- tapOn:
    id: "settings-close"

# ── Screenshot: final clean state ──
- takeScreenshot: final-clean-state
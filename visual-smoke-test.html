<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWW_PAINT vs Code-Painter — Visual Smoke Test</title>
<style>
  body { background:#111; color:#ddd; font-family:monospace; margin:0; padding:20px; overflow:auto; }
  h1 { font-size:16px; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .panel { background:#1a1a1a; border:1px solid #333; border-radius:6px; padding:10px; }
  .panel h3 { font-size:13px; color:#74c0fc; margin:0 0 8px; }
  canvas { width:100%; height:auto; display:block; border:1px solid #222; background:#000; }
  .info { font-size:11px; color:#888; margin-top:4px; }
  #status { font-size:12px; color:#ffd43b; margin-bottom:12px; }
  #btn-screenshot { padding:6px 12px; margin-top:12px; font-size:12px; background:#333; color:#eee; border:1px solid #555; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
<h1>WWW_PAINT vs Code-Painter — Visual Smoke Test</h1>
<div id="status">Loading...</div>
<div class="grid">
  <div class="panel">
    <h3>WWW_PAINT Painter (our engine)</h3>
    <canvas id="canvas-wwwp" width="512" height="384"></canvas>
    <div class="info" id="info-wwwp"> — </div>
  </div>
  <div class="panel">
    <h3>Code-Painter reference (JasBlack/code-painter)</h3>
    <canvas id="canvas-cp" width="512" height="384"></canvas>
    <div class="info" id="info-cp"> — </div>
  </div>
</div>
<button id="btn-screenshot" style="display:none;">Save Comparison Screenshot</button>

<!-- Load SHP library from extracted file -->
<script src="scripts/codepainter-shp.js"></script>

<!-- WWW_PAINT engine -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
  import { Painter } from './js/engine/painter.js';

  const canvasWwwp = document.getElementById('canvas-wwwp');
  const canvasCp   = document.getElementById('canvas-cp');
  const statusEl   = document.getElementById('status');
  const infoWwwp   = document.getElementById('info-wwwp');
  const infoCp     = document.getElementById('info-cp');
  const btnShot    = document.getElementById('btn-screenshot');

  const IMG_URL = './test-images/frog.jpg';
  const SEED = 12345;
  const MAX_SHAPES = 500;
  const STYLE = 'painterly';

  function log(msg) { statusEl.textContent = msg; }

  function drawShape(ctx, s) {
    const p = s.p;
    const a = s.a !== undefined ? s.a : 1;
    const c0 = s.c0, c1 = s.c1;
    ctx.save();
    ctx.globalAlpha = a;
    const ga = p[p.length - 2] || 0;
    const mx = (p[0]+p[4])/2, my = (p[1]+p[5])/2;
    const grad = ctx.createLinearGradient(mx-10, my-10, mx+10, my+10);
    grad.addColorStop(0, `rgb(${Math.round(c0[0])},${Math.round(c0[1])},${Math.round(c0[2])})`);
    grad.addColorStop(1, `rgb(${Math.round(c1[0])},${Math.round(c1[1])},${Math.round(c1[2])})`);
    ctx.fillStyle = grad; ctx.strokeStyle = grad;
    switch (s.t) {
      case 'E': ctx.beginPath(); ctx.ellipse(p[0],p[1],Math.max(0.1,p[2]),Math.max(0.1,p[3]),(p[4]||0),0,Math.PI*2); ctx.fill(); break;
      case 'B': {
        const r = Math.max(p[2]||1,p[3]||1);
        const grad2 = ctx.createRadialGradient(p[0],p[1],r*0.1,p[0],p[1],r);
        grad2.addColorStop(0,`rgb(${Math.round(c0[0])},${Math.round(c0[1])},${Math.round(c0[2])})`);
        grad2.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle = grad2; ctx.beginPath(); ctx.ellipse(p[0],p[1],Math.max(0.1,p[2]),Math.max(0.1,p[3]),(p[4]||0),0,Math.PI*2); ctx.fill();
        break;
      }
      case 'T': ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[2],p[3]); ctx.lineTo(p[4],p[5]); ctx.closePath(); ctx.fill(); break;
      case 'R': { ctx.save(); ctx.translate(p[0],p[1]); ctx.rotate(p[4]||0); ctx.fillRect(-p[2]/2,-p[3]/2,p[2],p[3]); ctx.restore(); break; }
      case 'S': { const w=Math.max(0.5,p[6]||1); ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(p[2],p[3],p[4],p[5]); ctx.stroke(); break; }
    }
    ctx.restore();
  }

  async function runWwwpPaint(ctx, px, w, h) {
    return new Promise((resolve) => {
      let shapeCount = 0;
      const painter = new Painter({
        width: w, height: h, imageData: new Uint8ClampedArray(px),
        options: {
          style: STYLE, smart: false, maxShapes: MAX_SHAPES, seed: SEED,
          onShape: (s) => { shapeCount++; drawShape(ctx, s); },
          onDone: (res) => { infoWwwp.textContent = res.count + ' shapes, ' + res.sim.toFixed(1) + '% sim'; resolve(shapeCount); },
        }
      });
      painter.start();
      setTimeout(() => { resolve(shapeCount); }, 30000);
    });
  }

  async function runCodePainter(ctx, px, w, h) {
    return new Promise((resolve, reject) => {
      let resolved = false;
      const blob = new Blob([window.CP_WORKER_SRC], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);
      const worker = new Worker(workerUrl);
      let shapeCount = 0;
      const handler = (e) => {
        const m = e.data;
        if (m.type === 'shape') {
          shapeCount++;
          const s = m.s;
          try { SHP.lib(ctx)[s.t](...SHP.args(s, 1)); } catch(err) { /* skip bad shape */ }
        } else if (m.type === 'done') {
          infoCp.textContent = shapeCount + ' shapes, ' + m.sim.toFixed(1) + '% sim';
          URL.revokeObjectURL(workerUrl);
          worker.terminate();
          if (!resolved) { resolved = true; resolve(shapeCount); }
        }
      };
      worker.addEventListener('message', handler);
      worker.onerror = (err) => { log('CP worker error: ' + err.message); infoCp.textContent = 'ERROR: ' + err.message; if (!resolved) { resolved = true; reject(err); } };
      worker.postMessage({
        type: 'start', gen: 1, w: w, h: h, data: px, current: null, count0: 0,
        shapes: MAX_SHAPES, styles: [STYLE], bgStyles: [],
        smart: false, abstract: false, lines: false,
        outline: 'off', rfill: 'off', stylesize: {},
        seed: SEED, size: 1, sizeRand: false, palette: null,
        under: false, order: null, line: null, band: null, fresh: null, video: false,
      });
    });
  }

  // Fetch Code-Painter worker source upfront
  log('Fetching code-painter worker source...');
  const workerText = await fetch('./scripts/codepainter-worker.js').then(r => r.text());
  window.CP_WORKER_SRC = workerText;
  // SHP is loaded via <script src="scripts/codepainter-shp.js"> above
  await new Promise(r => setTimeout(r, 100));
  if (typeof SHP === 'undefined') { log('SHP library not loaded!'); infoCp.textContent = 'SHP not loaded'; }

  // Load test image
  log('Loading test image...');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = async () => {
    const w = img.width, h = img.height;
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0);
    const id = tctx.getImageData(0,0,w,h);
    const px = new Uint8ClampedArray(id.data);

    // Compute average color for background
    let br=0,bg=0,bb=0,n=w*h;
    for(let i=0;i<px.length;i+=4){br+=px[i];bg+=px[i+1];bb+=px[i+2];}
    const avgColor = `rgb(${Math.round(br/n)},${Math.round(bg/n)},${Math.round(bb/n)})`;

    // --- WWW_PAINT ---
    canvasWwwp.width = w; canvasWwwp.height = h;
    const ctx1 = canvasWwwp.getContext('2d');
    ctx1.fillStyle = avgColor; ctx1.fillRect(0,0,w,h);
    log('Running WWW_PAINT Painter (seed=' + SEED + ', shapes=' + MAX_SHAPES + ', style=' + STYLE + ')...');
    await runWwwpPaint(ctx1, px, w, h);

    // --- Code-Painter reference ---
    canvasCp.width = w; canvasCp.height = h;
    const ctx2 = canvasCp.getContext('2d');
    ctx2.fillStyle = avgColor; ctx2.fillRect(0,0,w,h);
    log('Running Code-Painter (seed=' + SEED + ', shapes=' + MAX_SHAPES + ')...');
    await runCodePainter(ctx2, px, w, h);

    log('Done. Click button to save comparison screenshot.');
    btnShot.style.display = 'inline-block';
  };
  img.onerror = () => { log('Failed to load test image'); };
  img.src = IMG_URL;

  btnShot.onclick = () => {
    // Create composite: source + both outputs
    const gap = 20, labelH = 30;
    const W = canvasWwwp.width, H = canvasWwwp.height;
    const comp = document.createElement('canvas');
    comp.width = W * 2 + gap * 3;
    comp.height = H + labelH * 2 + gap * 3;
    const c = comp.getContext('2d');
    c.fillStyle = '#1a1a1a'; c.fillRect(0,0,comp.width,comp.height);
    c.fillStyle = '#74c0fc'; c.font = '14px monospace';
    c.fillText('Source: frog.jpg (' + W + 'x' + H + ')', gap, 20);
    c.drawImage(canvasWwwp, gap, labelH + gap);
    c.fillText('WWW_PAINT output', gap, H + labelH + gap);
    c.drawImage(canvasCp, gap * 2 + W, labelH + gap);
    c.fillText('Code-Painter reference', gap * 2 + W, H + labelH + gap);
    // Save
    comp.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'smoke-test-comparison.png';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  };
</script>
</body>
</html>
